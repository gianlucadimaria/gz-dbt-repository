version: 2

sources:
  - name: raw
    database: ultra-current-476109-p7
    schema: gz_raw_data
    description: Raw data from Greenweez source system

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
          - name: orders_id
            description: Unique id for each order
          - name: products_id
            description: Unique id for each product
          - name: date_date
            description: date of purchase
          - name: revenue
            description: total money earned
          - name: quantity
            description: Number of units sold

      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns:
          - name: products_id
            description: unique id for each product
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: cost price of the product

      - name: ship
        identifier: raw_gz_ship
        description: shipping costs and fees
        columns:
          - name: orders_id
            description: unique id for each order
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: cost charged for shipping
          - name: logcost
            description: cost of logistics
          - name: ship_cost
            description: total cost of shipping

      - name: adwords
        identifier: raw_gz_adwords
        description: data from adwords
        columns:
          - name: date_date
            description: unique id for each order
          - name: paid_source
          - name: camPGN_name
          - name: ads_cost
          - name: impression
          - name: click

      - name: bing
        identifier: raw_gz_bing
        description: data from bing
        columns:
          - name: date_date
            description: unique id for each order
          - name: paid_source
          - name: camPGN_name
          - name: ads_cost
          - name: impression
          - name: click

      - name: criteo
        identifier: raw_gz_criteo
        description: data from criteo
        columns:
          - name: date_date
            description: unique id for each order
          - name: paid_source
          - name: camPGN_name
          - name: ads_cost
          - name: impression
          - name: click

      - name: facebook
        identifier: raw_gz_facebook
        description: data from facebook
        columns:
          - name: date_date
            description: unique id for each order
          - name: paid_source
          - name: camPGN_name
          - name: ads_cost
          - name: impression
          - name: click

models:
  - name: int_sales_margin
    description: int model for sales margin
    columns:
      - name: orders_id
        description: unique id
        tests:
          - not_null
      - name: date_date
        description: date of order
        tests:
          - not_null
      - name: products_id
        description: unique for products
        tests:
          - not_null
      - name: quantity
        description: quantity of products
        tests:
          - not_null
      - name: revenue
        description: total rev generated
        tests:
          - not_null
      - name: purchase_price
        description: purchase price per product
        tests:
          - not_null
      - name: purchase_cost
        description: total purchase cost
        tests:
          - not_null
      - name: margin
        description: profit margin

  - name: int_orders_margin
    description: Intermediate model calculating profit margins
    columns:
      - name: orders_id
        description: unique id
        tests:
          - not_null
          - unique
      - name: date_date
        description: date
        tests:
          - not_null
      - name: quantity
        description: qty of products in order
        tests:
          - not_null
      - name: revenue
        description: total rev from the order
        tests:
          - not_null
      - name: purchase_cost
        description: total cost of purchase
        tests:
          - not_null
      - name: margin
        description: calculated margin

  - name: int_orders_operational
    description: operational margin of orders
    columns:
      - name: orders_id
        description: unique id for orders
        tests:
          - not_null
          - unique
      - name: date_date
        description: date
        tests:
          - not_null
      - name: operational_margin
        description: operational profit margin
        tests:
          - not_null

  - name: finance_days
    description: total aggregation
    columns:
      - name: date_date
        description: business date
        tests:
          - not_null
          - unique
      - name: total_transactions
        description: total number of orders
        tests:
          - not_null
      - name: total_revenue
        description: total rev
        tests:
          - not_null
      - name: average_basket
        description: avg revenue per transaction
        tests:
          - not_null
      - name: total_operational_margin
        description: total operational margin
        tests:
          - not_null
      - name: total_purchase_cost
        description: total cost of goods sold
        tests:
          - not_null
      - name: total_shipping_fees
        description: total of shipping fees
        tests:
          - not_null
      - name: total_log_costs
        description: total of logistics costs
        tests:
          - not_null
      - name: total_quantity
        description: sum of all quantities
        tests:
          - not_null

  - name: int_campaigns
    description: Combined advertising campaigns data from all platforms (AdWords, Bing, Criteo, Facebook) for unified analysis
    columns:
      - name: date_date
        description: Date when the campaign metrics were recorded
        tests:
          - not_null
      - name: paid_source
        description: Source of the paid traffic
        tests:
          - not_null
      - name: campaign_key
        description: Unique identifier for the campaign
        tests:
          - not_null
      - name: campaign_name
        description: Name of the advertising campaign
        tests:
          - not_null
      - name: ads_cost
        description: Total cost of the advertising campaign
        tests:
          - not_null
      - name: impression
        description: Number of ad impressions served
        tests:
          - not_null
      - name: click
        description: Number of ad clicks received
        tests:
          - not_null

  - name: int_campaigns_day
    description: Daily aggregated advertising campaign metrics across all platforms with performance KPIs
    columns:
      - name: date_date
        description: Date of the aggregated metrics
      - name: total_ads_cost
        description: Total advertising cost across all platforms
      - name: total_impressions
        description: Total number of ad impressions across all platforms
      - name: total_clicks
        description: Total number of ad clicks across all platforms
      - name: cpc
        description: Cost Per Click
      - name: cpm
        description: Cost Per Thousand Impressions
      - name: ctr
        description: Click-Through Rate
      - name: unique_campaigns
        description: Number of distinct campaigns running
      - name: unique_sources
        description: Number of distinct paid traffic sources
      - name: unique_platforms
        description: Number of distinct advertising platforms
