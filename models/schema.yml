version: 2

sources:
  - name: raw
    database: ultra-current-476109-p7
    schema: gz_raw_data
    description: Raw data from Greenweez source system

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
          - name: orders_id
            description: Unique id for each order
          - name: products_id
            description: Unique id for each product
          - name: date_date
            description: date of purchase
          - name: revenue
            description: total money earned
          - name: quantity
            description: Number of units sold

      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns:
          - name: products_id
            description: unique id for each product
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: cost price of the product

      - name: ship
        identifier: raw_gz_ship
        description: shipping costs and fees
        columns:
          - name: orders_id
            description: unique id for each order
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: cost charged for shipping
          - name: logcost
            description: cost of logistics
          - name: ship_cost
            description: total cost of shipping

models:
  - name: int_sales_margin
    description:
    columns:
      - name: orders_id
        description:
        tests:
          - not_null
      - name: date_date
        description:
        tests:
          - not_null
      - name: products_id
        description:
        tests:
          - not_null
      - name: quantity
        description:
        tests:
          - not_null
          - positive_value
      - name: revenue
        description:
        tests:
          - not_null
      - name: purchase_price
        description:
        tests:
          - not_null
      - name: purchase_cost
        description:
        tests:
          - not_null
      - name: margin
        description:

  - name: int_orders_margin
    description:
    columns:
      - name: orders_id
        description:
        tests:
          - not_null
          - unique
      - name: date_date
        description:
        tests:
          - not_null
      - name: quantity
        description:
        tests:
          - not_null
          - positive_value
      - name: revenue
        description:
        tests:
          - not_null
      - name: purchase_cost
        description:
        tests:
          - not_null
      - name: margin
        description:

  - name: int_orders_operational
    description: "operational margin of orders"
    columns:
